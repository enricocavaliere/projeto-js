<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="imc.css">
    <title>Calculadora IMC</title>
</head>
<body>
    <h1>Calculadora de IMC</h1>
    <div>
        <h2>Altura</h2>
        <input type="text" class="inp" id="altura" placeholder="Digite em metro(s)">
        <h2>Peso</h2>
        <input type="text" class="inp" id="peso" placeholder="Digite em quilogramas">
    </div>
        <button id="calcular"  class="botao">Calcular</button>
        <h2 id="resultado"></h2>
        <h2 id="categoria"></h2>
    
<script src="imc.js"></script>
</body>
</html>
